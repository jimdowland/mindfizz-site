<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindfizz homepage collage source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 2400px; height: 1200px; margin: 0; overflow: hidden; }
    body { background: #bbb9b7; }
    .collage { position: relative; width: 100%; height: 100%; filter: grayscale(1); }
    .slide { position: absolute; width: 950px; box-shadow: 0 14px 34px rgba(20, 18, 16, .26); transform: rotate(-7deg); }
    .s1 { top: -250px; left: -130px; }
    .s2 { top: -330px; left: 780px; }
    .s3 { top: -245px; left: 1730px; }
    .s4 { top: 300px; left: -410px; }
    .s5 { top: 220px; left: 555px; width: 1030px; }
    .s6 { top: 220px; left: 1575px; width: 1030px; }
    .s7 { top: 815px; left: -80px; }
    .s8 { top: 790px; left: 875px; }
    .s9 { top: 750px; left: 1810px; }
    .wash { position: absolute; inset: 0; background: rgba(224, 219, 215, .12); }
  </style>
</head>
<body>
  <div class="collage">
    <img class="slide s1" src="../img/Threshold/policy-report-title-slide-housing-advocacy.webp" alt="">
    <img class="slide s2" src="../img/Threshold/policy-recommendations-three-column-presentation-slide.webp" alt="">
    <img class="slide s3" src="../img/Threshold/circular-development-model-infographic-presentation-slide.webp" alt="">
    <img class="slide s4" src="../img/Threshold/problem-statement-narrative-framework-presentation-slide.webp" alt="">
    <img class="slide s5" src="../img/Threshold/policy-data-area-chart-presentation-slide-layout.webp" alt="">
    <img class="slide s6" src="../img/Threshold/presentation-closing-slide-branding-back-cover.webp" alt="">
    <img class="slide s7" src="../img/Threshold/executive-quote-testimonial-presentation-slide-layout.webp" alt="">
    <img class="slide s8" src="../img/Threshold/regional-demographic-data-table-presentation-slide.webp" alt="">
    <img class="slide s9" src="../img/Threshold/advocacy-data-comparison-infographic-presentation-slide.webp" alt="">
    <div class="wash"></div>
  </div>
</body>
</html>
